plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
    id 'realm-android'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk 36
    namespace "com.github.skytoph.simpleweather"

    defaultConfig {
        applicationId "com.github.skytoph.simpleweather"
        minSdk 24
        targetSdk 36
        versionCode 39
        versionName "1.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        resConfigs("en", "uk")
    }

    Properties properties = new Properties()
    properties.load(new FileInputStream(file(".signing")))

    signingConfigs {
        release {
            storeFile file(properties['keystore'])
            storePassword properties['keystore.password']
            keyAlias properties['keyAlias']
            keyPassword properties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-beta01'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.firebase:firebase-crashlytics-ktx:19.4.4'
    implementation 'com.google.firebase:firebase-analytics-ktx:22.5.0'
    testImplementation 'junit:junit:4.13.2'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation "com.squareup.moshi:moshi-kotlin:1.15.2"
    implementation "com.squareup.moshi:moshi:1.15.2"
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.2'

    implementation 'com.google.android.libraries.places:places:5.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    implementation "com.google.dagger:hilt-android:2.57"
    ksp "com.google.dagger:hilt-compiler:2.57"
    ksp "androidx.hilt:hilt-compiler:1.3.0"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4"
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    implementation "androidx.recyclerview:recyclerview:1.4.0"

    implementation "androidx.work:work-runtime-ktx:2.7.1"
    implementation "androidx.hilt:hilt-work:1.0.0"

    implementation 'com.facebook.shimmer:shimmer:0.5.0'
}